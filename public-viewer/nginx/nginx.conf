pid /tmp/nginx.pid;
error_log /dev/stderr crit;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 4k;
    server_tokens off;
    map $upstream_http_content_security_policy $viewer_csp {
        "" "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'; worker-src 'none'";
        default $upstream_http_content_security_policy;
    }

    upstream viewer { server public-viewer:8050; }
    upstream share_api { server api:3000; }

    server {
        listen 8080;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header X-Content-Type-Options "nosniff" always;
        # Dash supplies hashes for its inline renderer; no script unsafe-inline
        # or eval. Leaflet positions elements with inline styles.
        add_header Content-Security-Policy $viewer_csp always;

        proxy_hide_header Cache-Control;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Robots-Tag;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 35s;
        proxy_redirect off;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization "";

        location = /health { access_log off; return 200 "OK\n"; }

        location ~ "^/share/[0-9a-fA-F-]{36}$" {
            limit_except GET { deny all; }
            proxy_set_header Cookie "";
            proxy_set_header Host $http_host;
            proxy_set_header Authorization "";
            proxy_pass http://viewer;
        }
        location ~ ^/(assets/|_dash-component-suites/) {
            limit_except GET { deny all; }
            proxy_set_header Cookie "";
            proxy_set_header Host $http_host;
            proxy_set_header Authorization "";
            proxy_pass http://viewer;
        }
        location ~ ^/(_dash-layout|_dash-dependencies)$ {
            limit_except GET { deny all; }
            proxy_set_header Cookie "";
            proxy_set_header Host $http_host;
            proxy_set_header Authorization "";
            proxy_pass http://viewer;
        }
        location ~ "^/api/v1/public-shares/[0-9a-fA-F-]{36}/session(/refresh)?$" {
            limit_except POST { deny all; }
            proxy_set_header Origin $http_origin;
            proxy_set_header Host $http_host;
            proxy_set_header Authorization "";
            proxy_pass http://share_api;
        }
        location ~ "^/api/v1/public-shares/[0-9a-fA-F-]{36}/(manifest|tiles/[0-9a-fA-F-]{36}/[0-9]+/[0-9]+/[0-9]+\\.(png|pbf))$" {
            limit_except GET { deny all; }
            proxy_pass http://share_api;
        }
        location / { return 404; }
    }
}
