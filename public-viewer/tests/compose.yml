services:
  api:
    image: node:24.0.0-bullseye
    command: ["node", "/test/fixture-api.mjs"]
    volumes:
      - ./fixture-api.mjs:/test/fixture-api.mjs:ro
    ports:
      - "127.0.0.1:${FIXTURE_PORT}:3000"
  public-viewer:
    image: trendsearth-public-viewer:local
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
  gateway:
    image: trendsearth-public-viewer-gateway:local
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    ports:
      - "127.0.0.1:${GATEWAY_PORT}:8080"
    depends_on:
      - api
      - public-viewer
