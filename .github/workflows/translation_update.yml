name: Update translations

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/translation_update.yml'
  schedule:
    # Monday, Wednesday, and Friday; offset from the API UI's 4 AM run
    - cron: "30 4 * * 1,3,5"
  workflow_dispatch:
    inputs:
      force_pull:
        description: 'Force pull translations regardless of timestamps'
        required: false
        type: boolean
        default: false
      push_translations:
        description: 'Also push local translations (first-time seeding of Transifex)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

env:
  LANGUAGES: "ar en es fa fr pt ru sw zh"

jobs:
  translation_update:
    if: ${{ github.ref_name == 'develop' }}
    name: Update translations from Transifex
    runs-on: ubuntu-latest
    env:
      TX_TOKEN: ${{ secrets.TX_TOKEN }}
      TX_HOSTNAME: ${{ vars.TX_HOSTNAME }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install babel jinja2

      - name: Install Transifex CLI
        run: |
          curl -fsSL -L -o tx.tar.gz https://github.com/transifex/cli/releases/latest/download/tx-linux-amd64.tar.gz
          tar xzf tx.tar.gz tx
          chmod +x tx
          mkdir -p "$HOME/.local/bin"
          mv tx "$HOME/.local/bin/"
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          rm tx.tar.gz

      # babel.cfg paths are relative to the input dir, so extract from the repo root.
      - name: Extract translatable strings
        run: |
          pybabel extract -F babel.cfg -k _ -k N_ -k gettext -k lazy_gettext \
            -o gefapi/translations/messages.pot .

      - name: Validate extraction completeness
        run: |
          msgid_count=$(grep -c "^msgid " gefapi/translations/messages.pot || echo 0)
          MIN_STRINGS=40
          echo "Extracted $msgid_count translatable strings (minimum: $MIN_STRINGS)"
          if [ "$msgid_count" -lt "$MIN_STRINGS" ]; then
            echo "ERROR: extraction found too few strings; check babel.cfg and the -k keywords"
            exit 1
          fi

      - name: Update PO files from POT
        run: |
          for lang in $LANGUAGES; do
            pybabel update -i gefapi/translations/messages.pot \
              -d gefapi/translations -l $lang --no-fuzzy-matching
          done

      - name: Push local translations to Transifex
        if: ${{ inputs.push_translations }}
        run: tx push -s -t

      - name: Pull updated strings from Transifex
        run: |
          if [ "${{ inputs.force_pull }}" = "true" ]; then
            tx pull -f
          else
            tx pull
          fi

      - name: Push source strings to Transifex
        run: tx push -s

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: develop
          commit-message: Update translations
          committer: GitHub <noreply@github.com>
          author: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>
          branch: translation-updates
          delete-branch: true
          title: "Update translations"
          body: |
            Syncs the API's hosted sign-in, registration, and email strings with
            Transifex (resource `api-messages` in the `trendsearth-api-ui` project).

            - Extracted source strings into `gefapi/translations/messages.pot`
            - Pulled translations from Transifex and pushed new source strings

            `.mo` files are compiled in the Docker build, not committed.
